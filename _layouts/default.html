<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    // Apply saved language before paint to avoid a flash of the wrong language.
    (function () {
      try {
        var saved = localStorage.getItem('lang');
        if (saved !== 'ja' && saved !== 'en') {
          saved = (navigator.language || 'ja').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
        }
        document.documentElement.lang = saved;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">✦</span>
        <span class="brand-text" data-i18n="ja">Turnt Up Technologies株式会社<em>AI事業部</em></span>
        <span class="brand-text" data-i18n="en" lang="en">Turnt Up Technologies, Inc.<em>AI Division</em></span>
      </a>
      <nav class="site-nav">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="nav-link nav-github" href="https://github.com/turntuptechnologies-ai" target="_blank" rel="noopener noreferrer" aria-label="GitHub Organization">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M12 .5C5.73.5.75 5.48.75 11.75c0 4.97 3.22 9.18 7.69 10.66.56.1.77-.24.77-.54 0-.27-.01-1.16-.02-2.1-3.13.68-3.79-1.34-3.79-1.34-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.97 0 0 .94-.3 3.09 1.15.9-.25 1.86-.38 2.82-.38.96 0 1.92.13 2.82.38 2.15-1.45 3.09-1.15 3.09-1.15.61 1.54.23 2.69.11 2.97.72.79 1.16 1.79 1.16 3.02 0 4.32-2.63 5.27-5.14 5.55.4.34.76 1.02.76 2.06 0 1.49-.01 2.69-.01 3.05 0 .3.2.65.78.54A11.26 11.26 0 0 0 23.25 11.75C23.25 5.48 18.27.5 12 .5Z"/>
          </svg>
          <span class="nav-link-text">GitHub</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="wrap">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="footer-links">
        <a href="https://github.com/turntuptechnologies-ai" target="_blank" rel="noopener noreferrer">github.com/turntuptechnologies-ai</a>
      </p>
      <p>&copy; {{ 'now' | date: '%Y' }} Turnt Up Technologies, Inc. (AI Division) ✿</p>
    </div>
  </footer>

  <script>
    // Language toggle: persist choice and reflect it on <html lang>.
    (function () {
      var buttons = document.querySelectorAll('.lang-toggle button[data-lang]');
      function apply(lang) {
        document.documentElement.lang = lang;
        try { localStorage.setItem('lang', lang); } catch (e) {}
        buttons.forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
        });
      }
      buttons.forEach(function (b) {
        b.addEventListener('click', function () { apply(b.dataset.lang); });
      });
      // Sync button state with the language set early in <head>.
      apply(document.documentElement.lang === 'en' ? 'en' : 'ja');
    })();
  </script>
</body>
</html>
